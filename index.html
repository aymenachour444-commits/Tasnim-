<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasnim 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&family=Amiri:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #2a1a15;
    --bg-mid: #3a2420;
    --peach: #e8a87c;
    --gold: #d3a15a;
    --gold-soft: #e0bd8c;
    --cream: #f7ede2;
    --cream-dim: rgba(247,237,226,0.7);
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: radial-gradient(140% 100% at 50% 0%, #1c2a4a 0%, #10182f 45%, #070a17 100%);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    overflow-x: hidden;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* fixed night sky stars */
  .sky-stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .sky-star {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50%      { opacity: 0.9; }
  }

  .fireworks {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .spark {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    top: 0;
    left: 0;
    opacity: 0;
  }

  .hearts {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .heart {
    position: absolute;
    bottom: -12%;
    color: #ff6f9c;
    opacity: 0;
    animation: float-heart linear infinite;
  }

  @keyframes float-heart {
    0%   { transform: translateY(0) translateX(0) scale(0.85); opacity: 0; }
    8%   { opacity: 0.85; }
    88%  { opacity: 0.75; }
    100% { transform: translateY(-118vh) translateX(18px) scale(1.05); opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 3;
    width: min(92vw, 640px);
    text-align: center;
    padding: 3.5rem 1.5rem;
  }

  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 480px;
    height: 480px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,111,156,0.14) 0%, rgba(255,111,156,0) 70%);
    z-index: 2;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.94); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.05); }
  }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 3.2vw, 1.3rem);
    color: var(--gold-soft);
    letter-spacing: 0.04em;
    margin: 0 0 1.4rem;
    opacity: 0;
    animation: rise 1.1s ease-out 0.2s forwards;
    direction: ltr;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 8.4vw, 4.2rem);
    line-height: 1.16;
    margin: 0 0 0.6rem;
    color: var(--cream);
    letter-spacing: 0.01em;
    opacity: 0;
    animation: rise 1.1s ease-out 0.55s forwards;
  }

  h1 .to {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.4em;
    font-style: italic;
    color: var(--peach);
    font-weight: 400;
    margin-bottom: 0.35em;
  }

  h1 .name {
    display: block;
    color: var(--gold);
  }

  .line {
    width: 64px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 1.7rem auto;
    opacity: 0;
    animation: rise 1.1s ease-out 0.95s forwards;
  }

  .note {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.1rem, 3.6vw, 1.35rem);
    line-height: 1.9;
    color: var(--cream-dim);
    max-width: 36ch;
    margin: 0 auto;
    opacity: 0;
    animation: rise 1.1s ease-out 1.25s forwards;
    direction: ltr;
  }

  .sign {
    margin-top: 2.6rem;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    color: var(--gold-soft);
    opacity: 0;
    animation: rise 1.1s ease-out 1.55s forwards;
  }

  .footer-credit {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(247,237,226,0.5);
    z-index: 4;
    direction: ltr;
    opacity: 0;
    animation: rise 1.1s ease-out 1.85s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sky-star, .spark, .heart, .glow, .eyebrow, h1, .line, .note, .sign, .footer-credit {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .spark, .heart { display: none; }
  }
</style>
</head>
<body>

  <div class="sky-stars" id="skyStars"></div>
  <div class="fireworks" id="fireworks"></div>
  <div class="hearts" id="hearts"></div>
  <div class="glow"></div>

  <main class="stage">
    <p class="eyebrow">to my dearest sister</p>
    <h1>
      <span class="to">i love you, my sister</span>
      <span class="name">Tasnim</span>
    </h1>
    <div class="line"></div>
    <p class="note">And every year, may you be surrounded by a thousand blessings.<br>May your light always grow, and your joy always grow with it.</p>
    <p class="sign">— your brother, who loves you always</p>
  </main>

  <p class="footer-credit">created by aymen</p>

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // fixed twinkling sky stars
  const skyField = document.getElementById('skyStars');
  const starCount = 60;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('span');
    s.className = 'sky-star';
    const size = 1 + Math.random() * 2;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 60) + 'vh';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    s.style.animationDelay = (Math.random() * 4) + 's';
    skyField.appendChild(s);
  }

  // floating pink hearts
  const heartField = document.getElementById('hearts');
  const heartGlyphs = ['♥', '❤'];
  const heartTotal = 10;
  for (let i = 0; i < heartTotal; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = heartGlyphs[Math.floor(Math.random() * heartGlyphs.length)];
    const size = 22 + Math.random() * 30;
    h.style.left = (Math.random() * 100) + 'vw';
    h.style.fontSize = size + 'px';
    h.style.animationDuration = (10 + Math.random() * 8) + 's';
    h.style.animationDelay = (Math.random() * 12) + 's';
    heartField.appendChild(h);
  }

  // exploding fireworks
  if (!reduceMotion) {
    const fwField = document.getElementById('fireworks');
    const colors = ['#ff6f9c', '#ffd166', '#ff9ecf', '#7ec8ff', '#ffffff'];

    function launchFirework() {
      const originX = 15 + Math.random() * 70;
      const originY = 15 + Math.random() * 45;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const particleCount = 18;

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('span');
        p.className = 'spark';
        p.style.background = color;
        p.style.left = originX + 'vw';
        p.style.top = originY + 'vh';

        const angle = (Math.PI * 2 * i) / particleCount;
        const distance = 40 + Math.random() * 40;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        fwField.appendChild(p);

        const anim = p.animate([
          { transform: 'translate(0, 0) scale(1)', opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) scale(0.3)`, opacity: 0 }
        ], {
          duration: 1100 + Math.random() * 400,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
        });

        anim.onfinish = () => p.remove();
      }
    }

    setTimeout(launchFirework, 900);
    setInterval(() => {
      launchFirework();
      if (Math.random() > 0.5) {
        setTimeout(launchFirework, 350);
      }
    }, 2600);
  }
</script>

</body>
</html>
